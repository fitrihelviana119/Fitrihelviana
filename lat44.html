<h2>Deret Fibonacci</h2>
<p id="hasil"></p>

<script>
let a = 0;
let b = 1;
let c;

for (let i = 3; i <= 20; i++) {
    c = a + b;
    a = b;
    b = c;
}

document.getElementById("hasil").innerHTML =
    "Suku ke-20 Fibonacci adalah: " + b;
  </script>
  <h2>Penjumlahan Dua Bilangan</h2>

<label>Bilangan pertama:</label>
<input type="number" id="bilangan1">

<br><br>

<label>Bilangan kedua:</label>
<input type="number" id="bilangan2">

<br><br>

<button onclick="hitung()">Hitung</button>

<p id="hasil"></p>

<script>
function hitung() {
    let a = Number(document.getElementById("bilangan1").value);
    let b = Number(document.getElementById("bilangan2").value);
    let hasil = a + b;

    document.getElementById("hasil").innerHTML =
        "Hasil penjumlahan: " + hasil;
}
</script>
